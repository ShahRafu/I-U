name: Build Android APK

on:
  push:
    branches: [main, production-ready-trading]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components (CMake, NDK, build-tools, platforms)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          # find sdkmanager
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found under ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)" >&2
            exit 1
          fi

          echo "Accepting licenses..."
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true

          echo "Installing required components: cmake;3.18.1, ndk;25.1.8937393, build-tools;33.0.1, platforms;android-33"
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "cmake;3.18.1" "ndk;25.1.8937393" "build-tools;33.0.1" "platforms;android-33"

      - name: Debug and fix Gradle wrapper permissions & gradlew script
        run: |
          echo "=== Environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          which java || true
          java -version || true
          echo "=== gradle wrapper dir listing ==="
          ls -la gradle || true
          ls -la gradle/wrapper || true
          echo "=== file info for gradle-wrapper.jar ==="
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            stat -c 'mode=%a uid=%u gid=%g size=%s %n' gradle/wrapper/gradle-wrapper.jar || true
            file gradle/wrapper/gradle-wrapper.jar || true
            chmod a+r gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "gradle-wrapper.jar NOT FOUND at gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew || true
            chmod +x gradlew || true
            head -n 20 gradlew || true
          fi
          echo "=== Debug env done ==="

      - name: Build Owner APK
        run: ./gradlew assembleOwnerDebug --no-daemon

      - name: Build User APK
        run: ./gradlew assembleUserDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/

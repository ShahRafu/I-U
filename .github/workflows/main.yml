name: Build Android APK

on:
  push:
    branches: [main, production-ready-trading]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components (CMake, NDK, build-tools, platforms)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found under ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "cmake;3.18.1" "ndk;25.1.8937393" "build-tools;33.0.1" "platforms;android-33"

      - name: Ensure gradle wrapper JAR & gradlew script are usable (debug)
        run: |
          echo "=== print java info ==="
          echo "JAVA_HOME=$JAVA_HOME"
          which java || true
          java -version || true

          echo "=== listing wrapper folder ==="
          ls -la gradle || true
          ls -la gradle/wrapper || true

          echo "=== inspect gradle-wrapper.jar ==="
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            stat -c 'mode=%a uid=%u gid=%g size=%s %n' gradle/wrapper/gradle-wrapper.jar || true
            ls -l --full-time gradle/wrapper/gradle-wrapper.jar || true
            # ensure readable, and also give execute bit in case script tries to exec it by mistake
            chmod a+r gradle/wrapper/gradle-wrapper.jar || true
            chmod a+x gradle/wrapper/gradle-wrapper.jar || true
            # test reading it with java - show jar manifest entries
            if command -v java >/dev/null 2>&1; then
              echo "Testing java can read the wrapper jar (show manifest):"
              java -jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
              # alternatively show JAR file header
              hexdump -C gradle/wrapper/gradle-wrapper.jar | head -n 4 || true
            fi
          else
            echo "gradle-wrapper.jar NOT FOUND"
          fi

          echo "=== inspect gradlew script ==="
          if [ -f gradlew ]; then
            echo "stat for gradlew:"
            stat -c 'mode=%a uid=%u gid=%g size=%s %n' gradlew || true
            echo "First lines of gradlew:"
            sed -n '1,40p' gradlew || true
            # Normalize line endings
            if command -v dos2unix >/dev/null 2>&1; then
              dos2unix gradlew || true
            else
              sed -i 's/\r$//' gradlew || true
            fi
            chmod +x gradlew || true
            echo "After normalization stat:"
            stat -c 'mode=%a uid=%u gid=%g size=%s %n' gradlew || true
          else
            echo "gradlew not found"
          fi

      - name: Try running Gradle via wrapper (bash -x for debug)
        id: run-wrapper
        continue-on-error: true
        shell: bash
        run: |
          set -x
          # Run via bash explicitly (not /bin/sh) so we avoid dash parsing differences
          bash -x ./gradlew assembleOwnerDebug --no-daemon

      - name: Fallback: direct Java invocation of Gradle Wrapper Main (if wrapper failed)
        if: failure() || steps.run-wrapper.outcome == 'failure'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          echo "Wrapper failed — trying direct java invocation"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — aborting" >&2
            ls -la gradle/wrapper || true
            exit 2
          fi
          if [ -n "${JAVA_HOME}" ] && [ -x "${JAVA_HOME}/bin/java" ]; then
            JAVA_CMD="${JAVA_HOME}/bin/java"
          else
            JAVA_CMD="$(which java || true)"
          fi
          if [ -z "$JAVA_CMD" ]; then
            echo "java not found" >&2
            exit 3
          fi
          echo "Using java: $JAVA_CMD"
          # show that java can load the class
          "$JAVA_CMD" -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version || true
          # Now run the requested task
          "$JAVA_CMD" -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleOwnerDebug --no-daemon

      - name: Build User APK (run only if Owner build succeeded)
        if: success()
        run: ./gradlew assembleUserDebug --no-daemon

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/

name: Build Android APK

on:
  push:
    branches: [main, production-ready-trading]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components (CMake, NDK, build-tools, platforms)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found under ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)" >&2
            exit 1
          fi

          echo "Accepting licenses..."
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true

          echo "Installing required components: cmake;3.18.1, ndk;25.1.8937393, build-tools;33.0.1, platforms;android-33"
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "cmake;3.18.1" "ndk;25.1.8937393" "build-tools;33.0.1" "platforms;android-33"

      - name: Ensure gradle wrapper JAR & gradlew script are usable
        run: |
          echo "=== Listing wrapper folders ==="
          ls -la gradle || true
          ls -la gradle/wrapper || true

          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Found gradle-wrapper.jar — fixing permissions"
            chmod a+r gradle/wrapper/gradle-wrapper.jar || true
            stat -c 'mode=%a uid=%u gid=%g size=%s %n' gradle/wrapper/gradle-wrapper.jar || true
            file gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "gradle-wrapper.jar NOT FOUND at gradle/wrapper/gradle-wrapper.jar"
          fi

          if [ -f gradlew ]; then
            echo "Normalizing gradlew line endings and making executable"
            sed -i 's/\r$//' gradlew || true
            chmod +x gradlew || true
            head -n 12 gradlew || true
          else
            echo "gradlew script not found"
          fi

      - name: Try running Gradle via wrapper (preferred)
        id: run-wrapper
        continue-on-error: true
        run: |
          set -x
          ./gradlew assembleOwnerDebug --no-daemon
        shell: bash

      - name: Fallback: run Gradle by invoking wrapper main via java if wrapper failed
        if: failure() || steps.run-wrapper.outcome == 'failure'
        run: |
          echo "Wrapper failed — attempting direct Java invocation of Gradle Wrapper Main"
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            if [ -n "${JAVA_HOME}" ] && [ -x "${JAVA_HOME}/bin/java" ]; then
              JAVA_CMD="${JAVA_HOME}/bin/java"
            else
              JAVA_CMD="$(which java || true)"
            fi
            if [ -z "$JAVA_CMD" ]; then
              echo "java not found on PATH and JAVA_HOME not set correctly" >&2
              exit 2
            fi
            echo "Using java: $JAVA_CMD"
            "$JAVA_CMD" -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleOwnerDebug --no-daemon
          else
            echo "gradle-wrapper.jar missing — cannot run direct java invocation" >&2
            exit 3
          fi

      - name: Build User APK (run only if Owner build succeeded)
        if: success()
        run: ./gradlew assembleUserDebug --no-daemon

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/

name: Build Android APKs (owner + user)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found under ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "cmake;3.18.1" "ndk;25.1.8937393" "build-tools;33.0.1" "platforms;android-33"

      - name: Ensure gradlew and wrapper jar usable
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod a+r gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "::warning:: gradle/wrapper/gradle-wrapper.jar not found"
          fi
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew || true
            chmod +x gradlew || true
          fi

      - name: Build owner & user debug APKs (explicit tasks)
        run: |
          set -e
          echo "Building :app:assembleUserDebug"
          ./gradlew :app:assembleUserDebug --no-daemon || { echo "::error::assembleUserDebug failed"; exit 1; }
          echo "Building :app:assembleOwnerDebug"
          ./gradlew :app:assembleOwnerDebug --no-daemon || { echo "::error::assembleOwnerDebug failed"; exit 1; }

      - name: List build outputs (for debugging)
        run: |
          echo "==== app/build/outputs listing ===="
          ls -R app/build/outputs || true
          echo "==== find all apk files ===="
          find app/build/outputs -type f -name "*.apk" -print || true

      - name: Upload owner & user APKs (and any debug apks)
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: |
            app/build/outputs/apk/owner/debug/*.apk
            app/build/outputs/apk/user/debug/*.apk
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/**/*.apk

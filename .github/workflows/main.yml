name: Build Android APK

on:
  push:
    branches: [main, production-ready-trading]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure gradle wrapper JAR & gradlew script are usable
        run: |
          echo "Checking gradle wrapper..."
          ls -la gradle || true
          ls -la gradle/wrapper || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Found gradle-wrapper.jar — fixing perms"
            chmod a+r gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "gradle-wrapper.jar NOT FOUND (you may need to add it or run add-wrapper workflow)"
          fi
          if [ -f gradlew ]; then
            # normalize line endings and ensure executable
            sed -i 's/\r$//' gradlew || true
            chmod +x gradlew || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK (uses Gradle wrapper if available)
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            # fallback to system gradle if wrapper not executable
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/

name: Build Android APK (stable)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repo overview & gradle wrapper status
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "--- listing top-level ---"
          ls -la || true
          echo "--- listing gradle wrapper folder ---"
          ls -la gradle || true
          ls -la gradle/wrapper || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar: present"
            stat -c 'mode=%a uid=%u gid=%g size=%s %n' gradle/wrapper/gradle-wrapper.jar || true
          else
            echo "gradle-wrapper.jar: MISSING"
          fi

      - name: Quick env check
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java || true
          java -version || true

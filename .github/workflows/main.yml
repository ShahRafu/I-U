name: Build Android APK

on:
  push:
    branches: [main, production-ready-trading]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Owner APK
        run: ./gradlew assembleOwnerDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Build User APK
        run: ./gradlew assembleUserDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/

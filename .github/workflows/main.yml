name: Build Android APK

on:
  push:
    branches: [main, production-ready-trading]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v2
        with:
          api-version: 35
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:assembleOwnerDebug
      - run: ./gradlew :app:assembleUserDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/

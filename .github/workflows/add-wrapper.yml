name: Generate and add Gradle wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Gradle wrapper using Docker (Gradle 8.5 / JDK17)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace -w /workspace \
            gradle:8.5-jdk17 \
            gradle wrapper --gradle-version 8.5 --no-daemon

      - name: Show generated files
        run: |
          git status --porcelain
          ls -la gradle || true
          ls -la gradle/wrapper || true

      - name: Commit and push wrapper files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add the expected wrapper artifacts (safe list)
          git add -A gradle gradlew gradlew.bat || true
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: add generated Gradle wrapper (generated by workflow)"
            # Push to the same branch name as workflow-run branch; create branch if missing
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/add-gradle-wrapper
          else
            echo "No wrapper changes to commit."
          fi

      - name: Create Pull Request
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a PR if one doesn't already exist
          PR_EXISTS=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:add-gradle-wrapper&base=main" | jq 'length')
          if [ "$PR_EXISTS" = "0" ]; then
            curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls" \
              -d "$(jq -n --arg t "Add Gradle wrapper" --arg b "This PR adds generated Gradle wrapper files (gradle-wrapper.jar, gradlew, gradle/wrapper/*) so CI can run using the project wrapper.\n\nGenerated by workflow: .github/workflows/add-wrapper.yml" \
                '{title: $t, head: "add-gradle-wrapper", base: "main", body: $b}')"
            echo "Pull request created (if push added new commits)."
          else
            echo "Pull request already exists for add-gradle-wrapper."
          fi
